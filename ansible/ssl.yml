---
- name: Require both certificate target groups
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Require explicit certificate hosts for the two services
      ansible.builtin.assert:
        that:
          - groups.get('pos_servers', []) | length == 1
          - groups.get('appstore_servers', []) | length == 1
        fail_msg: Fill the pos_servers and appstore_servers inventory groups before requesting certificates.

- name: Automatically provision or renew Global POS SSL
  hosts: pos_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars:
    ssl_domain: '{{ pos_domain | default("pos.africandroid.world") }}'
    ssl_public_ip: '{{ pos_public_ip }}'
    ssl_email: '{{ pos_ssl_email }}'
    ssl_additional_public_ips: '{{ pos_ssl_additional_public_ips | default([]) }}'
    ssl_method: webroot
  tasks:
    - ansible.builtin.import_tasks: tasks/certificate.yml

- name: Automatically provision or renew separate Apps Store SSL
  hosts: appstore_servers
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars:
    ssl_domain: '{{ store_domain | default("africanappsstore.space") }}'
    ssl_public_ip: '{{ store_public_ip }}'
    ssl_email: '{{ store_ssl_email }}'
    ssl_additional_public_ips: '{{ store_ssl_additional_public_ips | default([]) }}'
    ssl_method: nginx
  tasks:
    - ansible.builtin.import_tasks: tasks/certificate.yml

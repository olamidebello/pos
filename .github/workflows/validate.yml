name: Validate agreement and deployment foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ansible-core>=2.16,<2.18'
      - run: python -m unittest discover -s tests -v
      - run: ansible-playbook -i localhost, ansible/deploy.yml --syntax-check
      - run: ansible-playbook ansible/push.yml --syntax-check
      - run: sh -n deploy/bootstrap.sh

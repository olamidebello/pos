name: Validate Global POS controls, marketplace and deployment
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'ansible-core>=2.16,<2.18'
      - run: python -m unittest discover -s tests -v
      - run: ansible-playbook -i localhost, ansible/deploy.yml --syntax-check
      - run: ansible-playbook ansible/push.yml --syntax-check
      - run: ansible-playbook -i localhost, ansible/deploy-olamidepanel.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory.two-server.example.ini ansible/update-and-publish.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory.two-server.example.ini ansible/configure-gateways.yml --syntax-check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check web/admin.js && node --check web/marketplace.js && node --check web/shop.js && node --check web/app.js && node --check web/sw.js
      - run: sh -n deploy/bootstrap.sh

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant menu · Global POS</title><link rel="stylesheet" href="/pos.css"><script src="/menu.js" defer></script></head><body><main class="public-page"><header class="public-header"><h1 id="restaurant-name">Restaurant menu</h1><p id="restaurant-location"></p><small id="menu-status" role="status">Opening the restaurant menu…</small></header><div class="split"><section><div id="menu-products" class="menu-list"></div></section><aside class="card"><h2>Your order request</h2><p class="notice">This sends an order request for staff acceptance. No payment is collected here. Discuss allergies directly with restaurant staff; menu information is supplied by the merchant.</p><div id="guest-cart"></div><form id="guest-order" class="stack"><label id="order-type-label">Order type<select name="mode"><option value="takeout">Takeout / pickup</option><option value="delivery">Delivery request — staff confirms fees</option></select></label><label id="delivery-address-label">Delivery address (for delivery requests)<textarea name="delivery_address" maxlength="500"></textarea></label><label>Guests<input name="guests" type="number" min="1" max="1000" value="1"></label><label>Contact (optional)<input name="contact" maxlength="200"></label><label class="row"><input name="accepted" type="checkbox" required> I reviewed the menu and authorize this order request.</label><button class="primary">Send order request</button></form><div id="guest-tracking"></div></aside></div></main></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>Store & POS · Global POS</title><script src="/merchant.js" defer></script></head><body><main><nav><a href="/">Global POS</a> · <a href="/pos.html">POS Only</a> · <a href="/restaurant.html">Restaurant</a></nav><h1>Store & POS</h1><p id="status" role="status"></p><form id="login"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><a href="/signup.html">Create account</a></form><section id="workspace" hidden><label>Your stores<select id="stores"></select></label><button id="newStore">Add store</button><button id="logout">Sign out</button><p id="notice"></p><form id="editor"><input name="store_id" type="hidden"><input name="revision" type="hidden"><label>Business<select name="tenant_id"></select></label><label>Store name<input name="name" required maxlength="150"></label><label>Headline<input name="headline" maxlength="150"></label><label>Description<textarea name="description" maxlength="2000"></textarea></label><label>Category<input name="category" value="Retail"></label><label>Address<input name="address" maxlength="500"></label><label><input name="virtual_only" type="checkbox"> Online-only store</label><label>Latitude<input name="lat" type="number" step="any" min="-90" max="90"></label><label>Longitude<input name="lon" type="number" step="any" min="-180" max="180"></label><label><input name="location_confirmed" type="checkbox"> I confirm this physical location</label><label>Country code<input name="country" required maxlength="2" value="US"></label><label>Currency code<input name="currency" required maxlength="3" value="USD"></label><label>Timezone<input name="timezone" required value="UTC"></label><label>Language<input name="language" value="en"></label><label>Opening hours<textarea name="hours"></textarea></label><label>Brand color<input name="accent" type="color" value="#17624c"></label><label>Logo HTTPS URL<input name="logo_url" type="url"></label><label>Store operation<select name="status"><option value="draft">Private draft</option><option value="active">Active</option></select></label><button>Save private draft</button></form><p id="link"></p><label><input id="publishConsent" type="checkbox"> I authorize public listing and accept the <a href="/terms.html">store terms</a>.</label><button id="publish">Publish storefront</button><button id="unpublish">Hide storefront</button><h2>Inventory</h2><p>Prices are in the currency’s smallest unit (for example 1299 = USD 12.99). Use the POS inventory screen for stock adjustments and transfers.</p><form id="product"><label>Product name<input name="name" required></label><label>Barcode<input name="barcode" required></label><label>Quantity<input name="quantity" type="number" min="0" step="1" required></label><label>Price in smallest currency unit<input name="price_minor" type="number" min="0" step="1" required></label><button>Add product</button></form><div id="products"></div></section></main></body></html>
